# Реплики персонажа после ответа. Можно редактировать и удалять строки.
# success — правильный ответ, failure — ошибка. Пустой набор задаётся как [].
# При новом ответе шанс реплики — 33%, время показа — 3 секунды.
success:
  - Молодец!
  - Так держать!
  - Красавчик!
  - Вот это башка!
  - Чертовски хорошо!
  - Охрененно!
  - Зашибись, попал!
  - Сегодня ты опасно умён!
  - Отдел Тайн напрягся!
  - Мракоборцы уже завидуют!
  - Палочка в надёжных руках!
  - Вот это уровень!
  - Схватил на лету!
  - В точку, колдун!
  - Разнёс вопрос!
  - Хорош, чертяка!
  - Тебя учили не зря!
  - В голове явно не опилки!
  - Прямо в яблочко!
  - Верно, чтоб тебя!
  - Красиво сработано!
  - Подозрительно толково!
  - Мозг сегодня при тебе!
  - Мое почтение, волшебник!
  - Кто-то всё-таки читал правила!
  - Зачёт, наглая морда!
  - Шаришь, нечего сказать!
  - Приятно видеть работающий мозг!
  - Палочку вверх, нос не задирай!
  - Мощно задвинул!
  - Чистая работа!
  - Десять очков твоей наглости!
  - Вот это подготовка!
  - Респект твоей черепушке!
  - Ладно, признаю, ты хорош!
  - Хвалю, пока никто не видит!
  - Чётко приложил интеллектом!
  - Твой мозг заслужил печеньку!
  - Да ты, мать твою, знаток!
  # Дополнительные особо грубые восторги
  - Охуенно, блядь!
  - Ебать ты гений!
  - Пиздато разнёс вопрос!
  - Заебись ответил, чертяка!
  - Ну ты и охуенный колдун!
  - Блядь, да ты ходячий Гримуар!
  - Ебать-копать, всё правильно!
  - Пиздец как хорош! Аплодирую стоя!
failure:
  - Облом!
  - Ты лошара!
  - Ну ты и лопух!
  - Палочка умнее хозяина!
  - Котелок не доварил!
  - Магия есть, мысли потерялись!
  - Садись, тролль!
  - Тебя кто к палочке подпустил?
  - Ну ты и ебалай!
  - Вот это ты облажался!
  - Мозг вышел покурить!
  - Дамблдор сделал вид, что не знаком с тобой!
  - Мракоборцы удалили твоё резюме!
  - Ты опасен. Для себя!
  - Палочку сдай, пока цел!
  - Грабли опознали постоянного клиента!
  - Опять интеллект на выходном!
  - Ну и чушь ты выбрал!
  - Магический талант к промахам!
  - Черепушка подвела!
  - Твой котёл варит только кашу!
  - Балда с волшебной палочкой!
  - Гоблин бы денег за такое не дал!
  - Ну ты, блин, стратег!
  - Эффектно сел в лужу!
  - Раздолбал собственную версию!
  - Шляпа просит вернуть голову!
  - У тебя талант выбирать неприятности!
  - Мимо кассы, великий маг!
  - Книжку бы открыть, герой!
  - Не ответ, а заявка в лазарет!
  - Колдомедики уже закатали рукава!
  - Морг одобряет твою подготовку!
  - Оптимизм есть, шансов маловато!
  - Вот так и становятся учебным пособием!
  - Уж лучше бы ты молчал, гений!
  - Пять баллов за уверенную чушь!
  - Палочка просит другого волшебника!
  - Невдолбенный промах!
  - Тролль просит не сравнивать его с тобой!
  - Извилина ушла в отпуск!
  - Где ты такую дичь вычитал?
  - Смело. Глупо, но смело!
  - Логика не пережила этот ответ!
  - Ну ты и дубина зачарованная!
  - Ответ уровня мокрого валенка!
  - Ты это серьёзно, чучело?
  - Колдун из тебя пока картонный только!
  - Нихрена ты не разобрался!
  - Голова нужна не только для шляпы!
  - Твоя уверенность меня пугает!
  - Ещё один подвиг без участия мозга!
  - Так и знал, что ты выкинешь фокус!
  - Мозги забыты в другой мантии!
  - Охренеть, какой кульбит мимо смысла!
  - Лошара ты сегодня знатный!
  - Полный провал, зато с огоньком!
  - Эту глупость даже магией не оправдать!
  # Дополнительная особо грубая ругань
  - Ну ты и тупой долбоёб!
  - Пиздец, приехали, блядь!
  - Ты вопрос жопой читал?
  - Ебануться, какой тупой ответ!
  - Мозги проебал по дороге?
  - Долбоебизм Ультима, блядь!
  - Полная хуета, садись, два!
